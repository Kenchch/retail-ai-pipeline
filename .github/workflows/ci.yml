name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite needs pandas and scikit-learn: it drives the real quality
      # rules, the real star-schema build and the real recommender on small
      # synthetic frames, rather than mocking the logic under test. It does not
      # need the 45 MB source extract - nothing here touches the network or
      # data/raw.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pip-audit

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict

  dag:
    # Airflow is deliberately NOT in requirements.txt: dags/ is only read by a
    # scheduler and nothing else in the repo imports it. But that meant the DAG
    # had never been executed by anything, and every bug it has carried has
    # been a wiring bug - a split publish holding two runs in the warehouse, an
    # all_done cleanup deleting the files needed to re-run the gate, a
    # one_failed archiver racing a parallel branch, and leaves that reported a
    # failed run as a success. None of those show up in a unit test of a stage
    # function; all of them show up in the trigger rules and the edges.
    #
    # Its own job, on one Python version, so the heavy install does not
    # multiply across the matrix above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # Constraints file pinned to the Airflow release: installing Airflow
      # without one resolves a different dependency set every week and the job
      # fails for reasons that have nothing to do with this repo.
      - name: Install Airflow
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==3.3.1" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.11.txt"
          pip install -r requirements-airflow.txt \
            -r requirements.txt -r requirements-dbt.txt pip-audit
          pip check

      - name: The worker has the dbt runtime used by the DAG
        run: dbt --version

      - name: The DAG loads and is wired correctly
        run: pytest -q tests/test_dag.py

      - name: Audit the actual worker environment
        run: pip-audit --local --strict

      # A skip here would be silent: pytest.importorskip means the file passes
      # by not running, so the job could go green having tested nothing. This
      # is what proves the install above actually took.
      - name: The DAG tests actually ran
        run: |
          out=$(pytest -q tests/test_dag.py --collect-only 2>&1)
          echo "$out" | tail -3
          echo "$out" | grep -q "skipped" \
            && { echo "the DAG tests skipped - Airflow did not import"; exit 1; }
          exit 0

  dbt:
    # One end-to-end run proves that dbt can resolve the atomically published
    # data/report pair, build the contracted mart and execute every data test.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dbt.txt pip-audit

      - name: Download the reference inputs
        run: python scripts/get_data.py

      - name: Publish one complete pipeline run
        run: python -m retail_pipeline.pipeline

      - name: Build and test the dbt consumer
        run: python scripts/run_dbt.py

      - name: Audit dbt dependencies
        run: pip-audit -r requirements-dbt.txt --strict
