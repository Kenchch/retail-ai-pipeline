name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite needs pandas and scikit-learn: it drives the real quality
      # rules, the real star-schema build and the real recommender on small
      # synthetic frames, rather than mocking the logic under test. It does not
      # need the 45 MB source extract - nothing here touches the network or
      # data/raw.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pip-audit

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict
