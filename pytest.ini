[pytest]
# The repository root has to be importable even though the project is now
# installed: tests/test_dag.py imports `dags` and tests/test_dbt_wrapper.py
# imports `scripts`, and neither is a package. They are entry points, read by a
# scheduler and run as commands, so packaging them would be wrong; putting the
# root on the path is what lets the tests reach them.
#
# `python -m pytest` prepends the working directory and bare `pytest` does not,
# so without this the suite passes locally and fails on a fresh clone running
# the exact command the README gives.
pythonpath = .
testpaths = tests
