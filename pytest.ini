[pytest]
# Put the repo root on sys.path so `retail_pipeline` imports without the package
# being installed.
#
# `python -m pytest` prepends the working directory automatically and bare
# `pytest` does not, so the suite passed locally and failed on a fresh clone
# running the exact command the README gives. CI is what found it: nobody types
# `python -m` when the README says `pytest -q`.
pythonpath = .
testpaths = tests
