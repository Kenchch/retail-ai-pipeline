[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-ai-pipeline"
version = "0.1.0"
description = "Retail ingestion, quality gate, star schema and co-purchase recommendations"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff==0.16.5", "pip-audit==2.10.1"]
dbt = ["dbt-core==1.12.3", "dbt-duckdb==1.11.0", "duckdb==1.5.5"]

# dags/, scripts/ and tests/ are entry points and are deliberately not packaged;
# listing the two importable packages explicitly stops setuptools guessing.
[tool.setuptools]
packages = ["retail_pipeline", "bi"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Pin the gate's rules instead of inheriting Ruff defaults that can change
# between releases. These cover syntax, imports, and Pyflakes correctness.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These entry points add the repository root to sys.path before local imports.
"scripts/*.py" = ["E402"]
"dags/*.py" = ["E402"]
# duckdb is optional in the core matrix, so importorskip must run first.
"tests/test_dbt_wrapper.py" = ["E402"]
