# Everything tunable lives here - no thresholds or team lists in code.

paths:
  raw: data/raw/online_retail.csv
  usage_events: data/raw/usage_events.csv
  processed: data/processed      # published analytics layer
  staging: data/staging          # DAG hand-off only - never published
  warehouse: data/warehouse/retail.db
  reports: reports

extract:
  column_map:
    InvoiceNo: invoice_no
    StockCode: stock_code
    Description: description
    Quantity: quantity
    InvoiceDate: invoice_ts
    UnitPrice: unit_price
    CustomerID: customer_id
    Country: country
  date_format: "%m/%d/%Y %H:%M"

quality:
  min_unit_price: 0.01
  max_unit_price: 1000.0
  non_product_codes: ["POST", "DOT", "M", "C2", "S", "BANK CHARGES", "AMAZONFEE", "CRUK", "PADS", "B", "D"]
  max_quarantine_rate: 0.30   # above this the run fails instead of loading

recommend:
  min_support_count: 30       # a pair must appear in at least this many baskets
  min_confidence: 0.10
  min_lift: 1.0
  top_n: 5
  max_basket_size: 60

adoption:
  # The roster is the source of truth: it is both the denominator for reach and
  # the team list the report iterates over. Deriving the team list from the
  # event log instead would drop any team with zero adoption - exactly the team
  # the report exists to surface.
  roster:
    Category Management: 18
    Merchandising: 14
    Online Trading: 11
    Marketing: 9
    Store Ops: 10
  active_window_weeks: 4
  target_reach_pct: 70
  target_action_rate_pct: 25
  target_csat: 4.0
